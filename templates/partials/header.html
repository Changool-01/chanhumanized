{# Site header: brand, nav, account menu. #}
<header class="site-header">
    <div class="site-header-inner">
        <a class="site-brand" href="{% url 'pages:home' %}">{{ site_name }}</a>
        <nav class="site-nav" aria-label="Primary">
            {% if user.is_authenticated %}
                <a href="{% url 'humanizer:workspace' %}">App</a>
                <a href="{% url 'humanizer:history' %}">History</a>
            {% endif %}
            <a href="{% url 'pages:pricing' %}">Pricing</a>
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
                <form class="site-logout" method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Log in</a>
                <a class="nav-cta" href="{% url 'accounts:register' %}">Create account</a>
            {% endif %}
        </nav>
    </div>
</header>
