{# Email login. #}
{% extends "accounts/auth_base.html" %}

{% block title %}Log in — {{ site_name }}{% endblock %}

{% block auth_inner %}
<h1>Log in</h1>
<p class="auth-lead">Use the email you registered with.</p>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>
        Email
        {{ form.username }}
        {{ form.username.errors }}
    </label>
    <label>
        Password
        {{ form.password }}
        {{ form.password.errors }}
    </label>
    <button class="btn-primary" type="submit">Log in</button>
</form>
<p class="auth-switch">
    <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
    ·
    <a href="{% url 'accounts:register' %}">Create account</a>
</p>
{% endblock %}
