{# Choose a new password from the emailed token. #}
{% extends "accounts/auth_base.html" %}

{% block title %}New password — {{ site_name }}{% endblock %}

{% block auth_inner %}
<h1>Choose a new password</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="btn-primary" type="submit">Save password</button>
</form>
{% endblock %}
