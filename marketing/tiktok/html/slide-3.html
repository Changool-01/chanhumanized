<!DOCTYPE html>

<head>

  <style>

      font-weight: 600;

      line-height: 1.58;

      margin: 0 0 30px;
    }
    .brand {
      font-family: "Helvetica Neue", "SF Pro Text", sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: #8d8d8d;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="fade"></div>
    <div class="copy">
      <h1>AI ပုံစံကို ၁၀% ကနေ ၃၀% ထိ လျှော့ချပြီး<br>ပိုလူဆန်အောင် ပြန်ရေးပေးတယ်။</h1>

    </div>
  </div>
</body>
</html>
