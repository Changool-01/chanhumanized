<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 720px; height: 1280px; overflow: hidden; background: #f4efe8; }
    .slide {
      width: 720px; height: 1280px;
      background: url("../source-v2/3.png") center top / cover no-repeat;
      position: relative;
    }
    .fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 540px;
      background: linear-gradient(to bottom,
        rgba(250,246,240,0) 0%,
        rgba(250,246,240,0.4) 28%,
        rgba(250,246,240,0.97) 54%,
        #faf6f0 100%);
    }
    .copy {
      position: absolute; left: 48px; right: 48px; bottom: 86px;
      text-align: center;
    }
    .stat {
      font-family: "Didot", "Bodoni 72", "Times New Roman", serif;
      font-weight: 400;
      font-size: 78px;
      letter-spacing: -0.03em;
      color: #2a241c;
      line-height: 1;
      margin: 0 0 22px;
    }
    h1 {
      font-family: "Myanmar MN", "Noto Sans Myanmar", "Myanmar Sangam MN", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 32px;
      line-height: 1.62;
      color: #2a241c;
      margin: 0 0 28px;
    }
    .brand {
      font-family: "Helvetica Neue", "SF Pro Text", sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.16em;
      color: #b0a59a;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="fade"></div>
    <div class="copy">
      <div class="stat">10–30%</div>
      <h1>AI နံ့က ၁၀% ကနေ ၃၀% လောက်<br>လျော့သွားတယ်။</h1>
      <div class="brand">Chan Humanized AI</div>
    </div>
  </div>
</body>
</html>
