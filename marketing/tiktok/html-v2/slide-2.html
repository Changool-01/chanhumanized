<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 720px; height: 1280px; overflow: hidden; background: #f3f2f0; }
    .slide {
      width: 720px; height: 1280px;
      background: url("../source-v2/2.png") center top / cover no-repeat;
      position: relative;
    }
    .fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 500px;
      background: linear-gradient(to bottom,
        rgba(247,246,244,0) 0%,
        rgba(247,246,244,0.5) 30%,
        rgba(247,246,244,0.97) 56%,
        #f7f6f4 100%);
    }
    .copy {
      position: absolute; left: 44px; right: 44px; bottom: 86px;
      text-align: center;
    }
    .steps {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin: 0 0 26px;
      font-family: "Myanmar MN", "Helvetica Neue", sans-serif;
      font-size: 15px;
      color: #6d675f;
    }
    .steps span { display: inline-flex; align-items: center; gap: 8px; }
    .num {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid #cfc8bf;
      font-family: "Helvetica Neue", sans-serif;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0;
      display: inline-flex; align-items: center; justify-content: center;
      color: #8a837a;
    }
    h1 {
      font-family: "Myanmar MN", "Noto Sans Myanmar", "Myanmar Sangam MN", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 34px;
      line-height: 1.62;
      color: #2a241c;
      margin: 0 0 28px;
    }
    .brand {
      font-family: "Helvetica Neue", "SF Pro Text", sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.16em;
      color: #b0a59a;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="fade"></div>
    <div class="copy">
      <div class="steps">
        <span><i class="num">1</i> ကူးထည့်</span>
        <span><i class="num">2</i> tone ရွေး</span>
        <span><i class="num">3</i> နှိပ်</span>
      </div>
      <h1>စာကူးထည့်။ tone ရွေး။<br>နှိပ်လိုက်ရုံပဲ။</h1>
      <div class="brand">Chan Humanized AI</div>
    </div>
  </div>
</body>
</html>
