<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 720px; height: 1280px; overflow: hidden; background: #f3efe8; }
    .slide {
      width: 720px; height: 1280px;
      background: url("../source-v2/4.png") center top / cover no-repeat;
      position: relative;
    }
    .fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 300px;
      background: linear-gradient(to bottom,
        rgba(250,247,242,0) 0%,
        rgba(250,247,242,0.55) 38%,
        rgba(250,247,242,0.97) 68%,
        #faf7f2 100%);
    }
    .copy {
      position: absolute; left: 48px; right: 48px; bottom: 86px;
      text-align: center;
    }
    h1 {
      font-family: "Myanmar MN", "Noto Sans Myanmar", "Myanmar Sangam MN", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 34px;
      line-height: 1.62;
      color: #2a241c;
      margin: 0 0 28px;
    }
    .brand {
      font-family: "Helvetica Neue", "SF Pro Text", sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.16em;
      color: #b0a59a;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="fade"></div>
    <div class="copy">
      <h1>ကြိုက်ရင် comment လေးရေးခဲ့နော်။</h1>
      <div class="brand">Chan Humanized AI</div>
    </div>
  </div>
</body>
</html>
