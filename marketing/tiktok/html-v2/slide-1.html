<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 720px; height: 1280px; overflow: hidden; background: #f6f1ea; }
    .slide {
      width: 720px; height: 1280px;
      background: url("../source-v2/1.png") center top / cover no-repeat;
      position: relative;
    }
    .fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 480px;
      background: linear-gradient(to bottom,
        rgba(255,252,247,0) 0%,
        rgba(255,252,247,0.45) 32%,
        rgba(255,252,247,0.96) 58%,
        #fffbf6 100%);
    }
    .copy {
      position: absolute; left: 52px; right: 52px; bottom: 86px;
      text-align: center;
    }
    .kicker {
      font-family: "Helvetica Neue", "SF Pro Text", sans-serif;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9a8f84;
      margin: 0 0 18px;
    }
    h1 {
      font-family: "Myanmar MN", "Noto Sans Myanmar", "Myanmar Sangam MN", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 34px;
      line-height: 1.62;
      color: #2a241c;
      margin: 0 0 28px;
    }
    .brand {
      font-family: "Helvetica Neue", "SF Pro Text", sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.16em;
      color: #b0a59a;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="fade"></div>
    <div class="copy">
      <h1>AI ရေးထားတာကို<br>ကိုယ်တိုင်ရေးသလို ပြန်ပြောင်းပေးတယ်။</h1>
      <div class="brand">Chan Humanized AI</div>
    </div>
  </div>
</body>
</html>
